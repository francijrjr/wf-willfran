<!DOCTYPE html>
<html lang=pt-BR>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>Exemplo de Uso — PO UI Vanilla</title>
  <link rel=preconnect href=https://fonts.googleapis.com>
  <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
  <link href=https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap rel=stylesheet>
  <link rel=stylesheet href=css/po-vanilla.css>
</head>
<body style=padding: 40px 20px; background: var(--canvas);>
  <div style=max-width: 900px; margin: 0 auto; display: grid; gap: 24px;>
    
    <!-- Cabeçalho -->
    <div style=display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 16px;>
      <div>
        <span class=po-tag brand>PO UI VANILLA</span>
        <h1 style=margin: 6px 0 0; font: 800 28px 'Manrope', sans-serif;>Demonstração Standalone</h1>
      </div>
      <button class=po-button primary onclick=PO.toast('Notificação do pacote PO Vanilla disparada!')>
        <i data-lucide=bell></i> Disparar Toast
      </button>
    </div>

    <!-- Formulário PO UI -->
    <div class=showcase>
      <h3 class=showcase-title>Formulário de Cadastro</h3>
      <div class=showcase-stack>
        <label class=po-field>
          <span class=required>Razão Social</span>
          <input class=po-control placeholder=Ex: TOTVS Brasil S/A>
        </label>

        <div class=showcase-row>
          <label class=po-field style=flex: 1;>
            <span>Data de Fundação</span>
            <input type=date class=po-control value=2026-08-30>
          </label>
          <label class=po-field style=flex: 1;>
            <span>Regime</span>
            <select class=po-control>
              <option>Simples Nacional</option>
              <option>Lucro Presumido</option>
              <option>Lucro Real</option>
            </select>
          </label>
        </div>

        <div class=showcase-row>
          <label class=po-checkbox><input type=checkbox checked> Ativo no sistema</label>
          <label class=po-switch><input type=checkbox checked><i></i></label>
          <span>Emitir notas automaticamente</span>
        </div>

        <div class=showcase-row style=margin-top: 10px;>
          <button class=po-button primary><i data-lucide=save></i> Salvar</button>
          <button class=po-button ghost>Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Tabela PO UI -->
    <div class=showcase>
      <h3 class=showcase-title>Registros Recentes</h3>
      <table class=po-table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Cliente</th>
            <th>Status</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><b>CLI-001</b></td>
            <td>Clínica Aurora Saúde</td>
            <td><span class=po-tag success>Ativo</span></td>
            <td>R$ 14.820,00</td>
          </tr>
          <tr>
            <td><b>CLI-002</b></td>
            <td>Mercado Central</td>
            <td><span class=po-tag warning>Pendente</span></td>
            <td>R$ 6.190,00</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src=https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js></script>
  <script src=js/po-vanilla.js></script>
</body>
</html>
